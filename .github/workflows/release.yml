name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

      - name: Validate workspace
        run: pnpm check

      - name: Package extension
        run: pnpm release:extension

      - name: Verify release assets
        run: pnpm verify:release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/1snap-"$GITHUB_REF_NAME"-chrome.zip
          release/1snap-"$GITHUB_REF_NAME"-chrome.zip.sha256
          --verify-tag
          --title "1Snap $GITHUB_REF_NAME"
          --notes-file "docs/releases/$GITHUB_REF_NAME.md"
