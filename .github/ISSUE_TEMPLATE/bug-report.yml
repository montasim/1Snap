name: Bug report
description: Report a reproducible 1Snap capture or result-page problem.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach private screenshots, credentials, or sensitive page content.
  - type: input
    id: version
    attributes:
      label: 1Snap version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome and operating system
      placeholder: Chrome 140 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include a public URL only when it is safe to share.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exact 1Snap error message when available.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private URLs, and sensitive captured content.
          required: true
